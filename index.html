<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2a"><title>Blue-Driving</title><style>body{margin:0;background:#101a2a;color:#e9f2ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px}button{background:#39bdf5;color:#061624;border:0;border-radius:9px;padding:12px;margin:5px;font-weight:700}button:disabled{opacity:.4}.panel{background:#1b2a40;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.value{font-size:30px;font-weight:700}small{color:#aabed5}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px}</style><main><header><h1>Blue-Driving</h1><small>Experimental OBD laboratory</small></header><p id="status" role="status">Disconnected. No vehicle data available.</p><button id="connect">Connect via Bluetooth</button><button id="disconnect" disabled>Disconnect</button><button id="demo">Demo mode</button><button id="export">Export CSV</button><button id="saveLog">Download diagnostic log</button><button id="copyLog">Copy log</button><div class="panel"><h2>Live readings</h2><div class="grid" id="gauges"></div><small id="source">Source: none</small></div><div class="panel"><h2>Protocol console</h2><p>BLE connection and authorized-service discovery only in this release. BlueDriver's proprietary handshake must be validated before commands are transmitted.</p><pre id="environment"></pre><pre id="log"></pre></div></main><script>
const fields=[['rpm','Engine RPM','rpm'],['speed','Vehicle speed','km/h'],['coolant','Coolant','°C'],['load','Engine load','%'],['intake','Intake air','°C'],['throttle','Throttle','%'],['voltage','Voltage','V']];const values={};let device=null,server=null,timer=null,mode='none',busy=false,session=0,intentional=false;const setBusy=v=>{busy=v;$('connect').disabled=v;$('demo').disabled=v;$('disconnect').disabled=!v&&!device};const samples=[];const $=id=>document.getElementById(id);const describeError=e=>{if(e==null)return String(e);if(typeof e==='string')return e;let parts=[];for(const k of ['name','message','code','stack']){try{if(e[k]!=null)parts.push(k+'='+String(e[k]))}catch(_){}}try{parts.push('string='+String(e))}catch(_){}try{parts.push('json='+JSON.stringify(e))}catch(_){}return parts.join(' | ')||'Unspecified rejection (browser supplied no details)'};const log=s=>{$('log').textContent+=new Date().toISOString()+' '+s+'\n'};function render(){ $('gauges').innerHTML=fields.map(([k,n,u])=>'<div class="panel"><small>'+n+'</small><div class="value">'+(values[k]??'—')+'</div><small>'+u+'</small></div>').join('');$('source').textContent='Source: '+mode; }function stop(){session++;intentional=true;setBusy(false);clearInterval(timer);timer=null;if(device?.gatt?.connected)device.gatt.disconnect();device=null;server=null;mode='none';$('status').textContent='Disconnected. No vehicle data available.';$('disconnect').disabled=true;render()}$('disconnect').onclick=stop;$('demo').onclick=()=>{stop();mode='SIMULATED';$('status').textContent='Demo mode: synthetic values, NOT vehicle readings.';timer=setInterval(()=>{values.rpm=Math.round(750+Math.random()*2500);values.speed=Math.round(Math.random()*90);values.coolant=89;values.load=Math.round(Math.random()*60);values.intake=28;values.throttle=Math.round(Math.random()*40);values.voltage=13.8;samples.push({time:new Date().toISOString(),source:mode,...values});render()},1000);render()};$('connect').onclick=async()=>{if(busy)return;stop();intentional=false;const attempt=++session;setBusy(true);if(!navigator.bluetooth){$('status').textContent='Web Bluetooth unavailable in this browser. Try Chrome on desktop or a compatible BLE browser.';return}try{log('Opening Bluetooth device chooser');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service']});if(attempt!==session)return;device.addEventListener('gattserverdisconnected',()=>{log('EVENT: GATT disconnected '+(intentional?'intentionally':'unexpectedly'));if(!intentional)stop()});log('Selected device: '+(device.name||'(unnamed)')+' / '+device.id);log('Attempting GATT connection');server=await device.gatt.connect();if(attempt!==session){server.disconnect();return}mode='BLE discovery';$('status').textContent='Connected to '+(device.name||'unnamed device')+'. Protocol not initialized.';$('disconnect').disabled=false;log('Connected: '+(device.name||'unnamed device')+' / id '+device.id);try{const services=await server.getPrimaryServices();log('Authorized GATT services: '+services.length);for(const service of services){log('SERVICE '+service.uuid);try{const chars=await service.getCharacteristics();for(const c of chars)log('CHAR '+c.uuid+' properties='+JSON.stringify({read:c.properties.read,write:c.properties.write,writeWithoutResponse:c.properties.writeWithoutResponse,notify:c.properties.notify,indicate:c.properties.indicate}));}catch(e){log('CHARACTERISTIC ENUMERATION ERROR '+describeError(e))}}}catch(e){log('SERVICE ENUMERATION ERROR '+describeError(e));log('Web Bluetooth only exposes services explicitly authorized in requestDevice; unknown proprietary services may remain hidden.')}log('No OBD commands sent. Proprietary protocol investigation required.');render()}catch(e){if(attempt===session){log('Connection error: '+describeError(e));$('status').textContent='Connection failed: '+describeError(e)}}finally{if(attempt===session)setBusy(false)}};$('export').onclick=()=>{const header=['time','source',...fields.map(f=>f[0])];const rows=[header.join(','),...samples.map(s=>header.map(k=>s[k]??'').join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='blue-driving-'+Date.now()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('environment').textContent='Browser: '+navigator.userAgent+'\nSecure context: '+isSecureContext+'\nWeb Bluetooth API: '+Boolean(navigator.bluetooth)+'\nNote: proprietary services not granted by the browser cannot be enumerated.';log('Diagnostic session started');$('saveLog').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('environment').textContent+'\n'+$('log').textContent],{type:'text/plain'}));a.download='blue-driving-diagnostics.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('copyLog').onclick=async()=>{try{await navigator.clipboard.writeText($('environment').textContent+'\n'+$('log').textContent);log('Diagnostic log copied')}catch(e){log('Copy failed: '+e.message)}};render();
</script></html>
